<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ tay học qua video</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main>
  <h1>Sổ tay học qua video</h1>
  <p class="muted">Mỗi bài gồm video kèm transcript tiếng Anh, phần giải thích dễ hiểu và 30 câu trắc nghiệm ôn tập.</p>
  <ul class="lesson-list" id="list"></ul>
  <p><a href="player.html">Mở trình xem video tự do (video + file .srt bất kỳ)</a></p>
</main>
<script src="lessons/registry.js"></script>
<script>
  const list = document.getElementById('list');
  for (const l of window.LESSONS) {
    let progress = '';
    try {
      const saved = JSON.parse(localStorage.getItem('quiz:' + l.id) || '{}');
      if (saved.total) progress = ` · Trắc nghiệm: đúng ${saved.correct}/${saved.total}`;
    } catch {}
    const li = document.createElement('li');
    li.innerHTML = `<a href="lesson.html?id=${l.id}"><div class="card">
      <div class="muted">Bài ${l.id}${progress}</div>
      <strong></strong><div class="muted vi"></div></div></a>`;
    li.querySelector('strong').textContent = l.title;
    li.querySelector('.vi').textContent = l.titleVi;
    list.appendChild(li);
  }
</script>
</body>
</html>
