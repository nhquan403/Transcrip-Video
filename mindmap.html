<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindmap</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  main.wide { max-width: none; padding: 0 16px; }
  .mm-wrap { position: relative; height: calc(100vh - 220px); min-height: 460px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .mm-wrap svg { width: 100%; height: 100%; display: block; }
  .mm-wrap .markmap { --markmap-text-color: #eee; --markmap-a-color: #79b8ff; --markmap-code-bg: #262626; --markmap-code-color: #eee; --markmap-circle-open-bg: #111; }
  .mm-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
  .mm-tools button { background: #333; color: var(--text); border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 14px; }
</style>
</head>
<body>
<main class="wide">
  <nav class="nav"><a href="index.html" id="back">← Danh sách bài học</a></nav>
  <h1 id="mmTitle">🧠 Mindmap</h1>
  <p class="muted"><span id="mmIntro"></span>
  Bấm vào chấm tròn để mở hoặc đóng một nhánh, kéo để di chuyển, cuộn để phóng to. Bấm vào tên bài để mở bài học.</p>
  <div class="mm-tools">
    <button data-level="1">Chỉ các nhóm</button>
    <button data-level="2">Mở tới tên bài</button>
    <button data-level="9">Mở tất cả</button>
  </div>
  <div class="mm-wrap">
<svg id="mm"></svg>

  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12"></script>
<script src="lessons/registry.js"></script>
<script>
  // mindmap.html?part=N renders lessons/partN/mindmap.js (window.MINDMAP = { intro, md }).
  const partId = Number(new URLSearchParams(location.search).get('part')) || 2;
  const part = window.PARTS.find(p => p.id === partId);
  document.title = `Mindmap ${part ? part.title : ''}`;
  document.getElementById('mmTitle').textContent = `🧠 Mindmap ${part ? part.title + ' · ' + part.name : ''}`;
  document.getElementById('back').href = `index.html#part-${partId}`;
  const script = document.createElement('script');
  script.src = `lessons/part${partId}/mindmap.js`;
  script.onerror = () => { document.getElementById('mmIntro').textContent = 'Phần này chưa có mindmap.'; };
  script.onload = () => {
    document.getElementById('mmIntro').innerHTML = window.MINDMAP.intro;
    const { Transformer, Markmap, deriveOptions } = window.markmap;
    const { root, frontmatter } = new Transformer().transform(window.MINDMAP.md);
    const mm = Markmap.create('#mm', deriveOptions(frontmatter && frontmatter.markmap), root);

    // Fold every node at or below `level` (root = 0, groups = 1, lessons = 2), then redraw.
    function expandTo(level) {
      (function walk(node, depth) {
        node.payload = { ...node.payload, fold: depth >= level ? 1 : 0 };
        (node.children || []).forEach(c => walk(c, depth + 1));
      })(mm.state.data, 0);
      return mm.renderData().then(() => mm.fit());
    }
    expandTo(2);
    document.querySelectorAll('.mm-tools button').forEach(btn =>
      btn.addEventListener('click', () => expandTo(Number(btn.dataset.level))));
  };
  document.body.appendChild(script);
</script>
</body>
</html>
